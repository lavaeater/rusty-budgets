default_job = "nextest"
env.CARGO_TERM_COLOR = "always"

[jobs.clippy-server]
command = ["cargo", "+nightly", "clippy", "--package", "web", "--features", "server", "-Z", "codegen-backend",           # Unlocks the unstable backend feature flag
    "--timings"]
need_stdout = false

[jobs.clippy-server.env]
CARGO_PROFILE_DEV_CODEGEN_BACKEND = "cranelift"  # Dynamically assigns cranelift to dev builds
RUSTC_WRAPPER = "sccache"

[jobs.clippy-client]
command = ["cargo", "+nightly", "clippy", "--package", "web", "--features", "web", "-Z", "codegen-backend",           # Unlocks the unstable backend feature flag
    "--timings"]
need_stdout = false

[jobs.clippy-client.env]
CARGO_PROFILE_DEV_CODEGEN_BACKEND = "cranelift"  # Dynamically assigns cranelift to dev builds
RUSTC_WRAPPER = "sccache"

[jobs.clippy-mobile]
command = ["cargo", "+nightly", "clippy", "--package", "mobile", "--features", "mobile", "-Z", "codegen-backend",
    "--timings"]
need_stdout = false

[jobs.clippy-mobile.env]
CARGO_PROFILE_DEV_CODEGEN_BACKEND = "cranelift"  # Dynamically assigns cranelift to dev builds
RUSTC_WRAPPER = "sccache"

[jobs.nextest]
command = [
    "sh", "-c",
    "cargo llvm-cov nextest --hide-progress-bar --failure-output final | awk '/^Filename/{printf \"%-40s %9s %8s %13s %9s\\n\",\"File\",\"MissLine\",\"Line%\",\"MissBranch\",\"Branch%\"; printf \"%s\\n\",\"----------------------------------------\"; next} /^-/{next} NF==13{printf \"%-40s %9s %8s %13s %9s\\n\",$1,$9,$10,$12,$13; next} {print}'"
]
need_stdout = true
analyzer = "nextest"

[jobs.nextest-cov]
command = [
    "sh", "-c",
    "out=$(cargo llvm-cov nextest --hide-progress-bar --failure-output final 2>&1); s=$?; printf '%s\\n' \"$out\" | awk -v failed=$s '/^Filename/{printf \"%-40s %9s %8s %13s %9s\\n\",\"File\",\"MissLine\",\"Line%\",\"MissBranch\",\"Branch%\"; printf \"%-40s\\n\",\"----------------------------------------\"; next} /^-+$/{next} NF==13{printf \"%-40s %9s %8s %13s %9s\\n\",$1,$9,$10,$12,$13; next} failed{print}'"
]
need_stdout = true
analyzer = "nextest"

[keybindings]
s = "job:clippy-server"
c = "job:clippy-client"
t = "job:nextest"
v = "job:nextest-cov"