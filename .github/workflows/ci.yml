name: CI

# Fast, always-on native job. Covers testing Layers 1–3 (unit, CQRS/aggregate,
# and dioxus-ssr component render tests) with no browser or external services.
# See docs/testing.md.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      # The `ui` component tests and `api` tests build without the server
      # feature; keep this the fast native gate.
      - name: Test (workspace)
        run: cargo test --workspace

      # Informational: the crates already `#![allow(...)]` several lints, so this
      # doesn't deny on warnings — tighten to `-D warnings` once the tree is clean.
      - name: Clippy (workspace)
        run: cargo clippy --workspace
