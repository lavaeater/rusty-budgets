name: E2E

# Slow, high-value Playwright job (testing Layer 4, see docs/testing.md). Boots
# the real fullstack web build against a throwaway SQLite database and drives it
# in headless Chromium. Kept in a separate workflow because the first fullstack
# wasm build is expensive; it runs on PRs and pushes to main but is expected to
# be the longer gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (+ wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install the Dioxus CLI (dx)
        # Pin to the version the project builds against; `cargo binstall` is much
        # faster than a source build when a prebuilt binary is available.
        run: |
          cargo install cargo-binstall --locked || true
          cargo binstall -y dioxus-cli || cargo install dioxus-cli --locked

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install E2E deps
        working-directory: e2e
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        # The webServer block migrates a throwaway SQLite DB and then boots
        # `dx serve`; DATABASE_URL/DATA_FILE are set per-run by the config.
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
