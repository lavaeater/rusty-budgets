services:
  postgres:
    # Official Postgres image from DockerHub (we use the last version)
    image: "postgres:latest"
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres # The PostgreSQL user (useful to connect to the database)
      POSTGRES_PASSWORD: birkobengo # The PostgreSQL password (useful to connect to the database)
      POSTGRES_DB: rusty_budgets # The PostgreSQL default database (automatically created at first launch)
    # The `volumes` tag allows us to share a folder with our container.
    # Its syntax is as follows: [folder path on our machine]:[folder path to retrieve in the containqer]
    volumes:
      - ../oxide-data/postgres/:/var/lib/postgresql/
    restart: unless-stopped
    networks:
      - proxy-network

networks:
  proxy-network:
    ipam:
      config:
        - subnet: 172.24.0.0/16
    driver: bridge
    name: proxy-network