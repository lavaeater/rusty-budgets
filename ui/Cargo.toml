[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
dioxus = { workspace = true }
dioxus-primitives = { git = "https://github.com/lavaeater/dioxus-components.git", branch = "0.8", version = "0.0.1", default-features = false }
api = { workspace = true }
uuid = { workspace = true  }
strum = { workspace = true }
chrono = {workspace = true}
lucide-dioxus = { workspace = true }
rfd = { version = "0.17.2", features = ["xdg-portal"] }

[build-dependencies]
chrono = { workspace = true }

[dev-dependencies]
# Layer 3 test harness: render components to HTML on the native target (no
# browser). See docs/testing.md. dioxus-ssr is used purely as a test harness —
# there is no SSR in production for the UI crate.
dioxus-ssr = "0.8.0-alpha.1"
pretty_assertions = "1"

[features]
server = ["api/server"]
